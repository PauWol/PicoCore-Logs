[project]
name = "picocore-logs"
version = "0.1.0"
description = "Interactive CLI and toolkit for managing, downloading, and converting binary log files from PicoCore / ESP32 MicroPython devices."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mpremote>=1.28.0",
    "pyserial>=3.5",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]
[project.scripts]
picologs = "main:main"